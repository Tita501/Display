<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi tienda en línea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="encabezado">
        <h1>Mi tienda en línea</h1>
        <nav class="menu">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-productos">
        
        <article class="tarjeta-producto">
            <div class="contenedor-imagen">
                <span class="etiqueta-oferta">20% OFF</span>
                <img src="Cafe.webp" alt="Café">
            </div>
            <div class="info-producto">
                <h2 class="nombre-producto">Nescafe</h2>
                <p class="descripcion-producto">Cafe soluble de la marca Nescafe.</p>
                <p class="precio-producto">$115.00 MXN</p>
                <button class="btn-comprar">Comprar</button>
            </div>
        </article>

    </main>

</body>
</html>
